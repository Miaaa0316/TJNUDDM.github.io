    // 3. 获取DOM元素
    const collegeSelect = document.getElementById("college");
    const majorSelect = document.getElementById("major");
    const queryBtn = document.getElementById("queryBtn");
    const courseTableDiv = document.getElementById("courseTable");

    // 4. 学院选择改变时，更新专业下拉框
    collegeSelect.addEventListener("change", function () {
      const selectedCollege = this.value;
      // 清空专业下拉框
      majorSelect.innerHTML = '<option value="">请选择专业</option>';

      if (selectedCollege) {
        // 获取对应专业列表
        const majors = collegeMajorMap[selectedCollege];
        // 生成专业选项
        majors.forEach((major) => {
          const option = document.createElement("option");
          option.value = major;
          option.textContent = major;
          majorSelect.appendChild(option);
        });
      }
    });

    // 5. 查询按钮点击事件
    queryBtn.addEventListener("click", function () {
      const selectedCollege = collegeSelect.value;
      const selectedMajor = majorSelect.value;

      if (!selectedCollege || !selectedMajor) {
        alert("请先选择学院和专业！");
        return;
      }

      // 获取对应专业的课程
      const courses = courseData[selectedMajor] || [];

      if (courses.length === 0) {
        courseTableDiv.innerHTML = '<div class="no-data">暂无课程数据</div>';
        return;
      }

      // 生成课程表HTML
      let tableHtml = `
        <table>
          <thead>
            <tr>
              <th>课程名称</th>
              <th>学分</th>
              <th>课程类型</th>
              <th>学年学期</th>
            </tr>
          </thead>
          <tbody>
      `;

      courses.forEach((course) => {
        tableHtml += `
          <tr>
            <td>${course.name}</td>
            <td>${course.credit}</td>
            <td>${course.type}</td>
            <td>${course.time}</td>
          </tr>
        `;
      });

      tableHtml += `
          </tbody>
        </table>
      `;

      courseTableDiv.innerHTML = tableHtml;
    });
  </script>
